{% extends "base.html" %}
{% block content %}
<div class="form-card">
  <h2>Create an account</h2>
  <form method="post">
    <label class="form-label mt-3">Full name</label>
    <input class="form-control" name="name" maxlength="100" required>
    <label class="form-label mt-3">Email</label>
    <input class="form-control" type="email" name="email" required>
    <label class="form-label mt-3">Password (minimum 8 characters)</label>
    <input class="form-control" type="password" name="password" minlength="8" required>
    <button class="btn btn-primary w-100 mt-4">Register</button>
  </form>
  <p class="mt-3">Already registered? <a href="{{ url_for('login') }}">Login</a></p>
</div>
{% endblock %}
